description "Lattica Core Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env LATTICAD_BIN="/usr/bin/latticad"
env LATTICAD_USER="lattica"
env LATTICAD_GROUP="lattica"
env LATTICAD_PIDDIR="/var/run/latticad"
# upstart can't handle variables constructed with other variables
env LATTICAD_PIDFILE="/var/run/latticad/latticad.pid"
env LATTICAD_CONFIGFILE="/etc/lattica/lattica.conf"
env LATTICAD_DATADIR="/var/lib/latticad"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    # this will catch non-existent config files
    # latticad will check and exit with this very warning, but it can do so
    # long after forking, leaving upstart to think everything started fine.
    # since this is a commonly encountered case on install, just check and
    # warn here.
    if ! grep -qs '^rpcpassword=' "$LATTICAD_CONFIGFILE" ; then
        echo "ERROR: You must set a secure rpcpassword to run latticad."
        echo "The setting must appear in $LATTICAD_CONFIGFILE"
        echo
        echo "This password is security critical to securing wallets "
        echo "and must not be the same as the rpcuser setting."
        echo "You can generate a suitable random password using the following "
        echo "command from the shell:"
        echo
        echo "bash -c 'tr -dc a-zA-Z0-9 < /dev/urandom | head -c32 && echo'"
        echo
        echo "It is recommended that you also set alertnotify so you are "
        echo "notified of problems:"
        echo
        echo "ie: alertnotify=echo %%s | mail -s \"Lattica Alert\"" \
            "admin@foo.com"
        echo
        exit 1
    fi

    mkdir -p "$LATTICAD_PIDDIR"
    chmod 0755 "$LATTICAD_PIDDIR"
    chown $LATTICAD_USER:$LATTICAD_GROUP "$LATTICAD_PIDDIR"
    chown $LATTICAD_USER:$LATTICAD_GROUP "$LATTICAD_CONFIGFILE"
    chmod 0660 "$LATTICAD_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$LATTICAD_PIDFILE" \
    --chuid $LATTICAD_USER:$LATTICAD_GROUP \
    --exec "$LATTICAD_BIN" \
    -- \
    -pid="$LATTICAD_PIDFILE" \
    -conf="$LATTICAD_CONFIGFILE" \
    -datadir="$LATTICAD_DATADIR" \
    -disablewallet \
    -daemon

